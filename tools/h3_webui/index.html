<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h3 video</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --panel2: #1c232e; --line: #29323f;
    --text: #e8edf4; --dim: #8b97a7; --accent: #4da3ff; --ok: #43c98b;
    --err: #ff6b6b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 22px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  header span { color: var(--dim); font-size: 12.5px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 18px;
         padding: 18px 22px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px 16px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px;
          text-transform: uppercase; letter-spacing: .5px; }
  textarea, input, select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px;
    font: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  input[type=file] { padding: 5px; font-size: 12px; }
  input[type=checkbox] { width: auto; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .inline { display: flex; align-items: center; gap: 7px; color: var(--dim);
            font-size: 12.5px; margin-top: 6px; }
  button { background: var(--accent); border: 0; color: #06131f; font: inherit;
           font-weight: 650; border-radius: 8px; padding: 10px 14px;
           cursor: pointer; width: 100%; margin-top: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  button.small { width: auto; padding: 4px 10px; font-size: 12px;
                 background: var(--panel2); color: var(--dim);
                 border: 1px solid var(--line); margin: 0; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { color: var(--dim); cursor: pointer; font-size: 12.5px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 5px; }
  .warn { color: #e6b450; }
  .job { margin-bottom: 12px; }
  .job .head { display: flex; justify-content: space-between; gap: 10px;
               align-items: center; }
  .phase { color: var(--accent); font-size: 12.5px; }
  .bar { height: 7px; background: var(--panel2); border-radius: 4px;
         overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent);
           transition: width .6s; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .error { color: var(--err); font-size: 12px; white-space: pre-wrap;
           margin-top: 6px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
             gap: 14px; margin-top: 14px; }
  .clip video { width: 100%; border-radius: 7px; background: #000; display: block; }
  .clip .prompt { font-size: 12.5px; margin: 7px 0 3px; }
  .clip .meta a { color: var(--accent); text-decoration: none; }
  .clip .meta .del { color: var(--dim); background: none; border: 0;
                     font: inherit; padding: 0; cursor: pointer; }
  .clip .meta .del:hover { color: var(--err); }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .6px; margin: 4px 0 10px; }
</style>
</head>
<body>
<header>
  <h1>h3 <span style="color:var(--accent)">›</span> MiniMax-H3 video</h1>
  <span id="engine-note">multimodal text · image · video · audio → video</span>
</header>
<main>
  <form class="card" id="form">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" name="prompt" placeholder="Describe the video…" required>A cat wearing sunglasses rides a skateboard through a neon-lit city at night, cinematic</textarea>

    <div class="row">
      <div>
        <label>Duration</label>
        <select name="seconds" id="seconds">
          <optgroup label="single clip">
            <option value="2">2 s</option><option value="3">3 s</option>
            <option value="5" selected>5 s</option><option value="8">8 s</option>
            <option value="10">10 s</option><option value="15">15 s</option>
          </optgroup>
          <optgroup label="longer (auto-chained)">
            <option value="20">20 s</option><option value="30">30 s</option>
            <option value="45">45 s</option><option value="60">60 s</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label>Size</label>
        <select id="size">
          <option value="864x480" selected>864 × 480</option>
          <option value="480x864">480 × 864 (portrait)</option>
          <option value="640x640">640 × 640</option>
          <option value="512x512">512 × 512</option>
        </select>
      </div>
    </div>
    <div class="note" id="chain-note" style="display:none"></div>
    <div class="row">
      <div>
        <label>Speed / quality</label>
        <select name="preset" id="preset"></select>
      </div>
      <div>
        <label>Steps</label>
        <input type="number" name="steps" value="20" min="2" max="100">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Seed</label>
        <input type="number" name="seed" value="42" min="0">
      </div>
      <div>
        <label>&nbsp;</label>
        <span class="inline"><input type="checkbox" name="random_seed" id="random_seed" checked> randomize</span>
      </div>
    </div>

    <details open>
      <summary>Conditioning &amp; references</summary>
      <label>First frame (image)</label>
      <input type="file" name="first_frame" accept="image/*">
      <label>Last frame (image)</label>
      <input type="file" name="last_frame" accept="image/*">
      <div id="refblock">
        <label>Reference images <span id="ref-tag" class="warn"></span></label>
        <input type="file" name="ref_images" accept="image/*" multiple id="ref_images">
        <label>Reference video</label>
        <input type="file" name="ref_video" accept="video/*" id="ref_video">
        <span class="inline"><input type="checkbox" name="ref_video_mute"> drop its audio</span>
        <label>Reference audio</label>
        <input type="file" name="ref_audio" accept="audio/*" id="ref_audio">
        <div class="note" id="ref-note"></div>
      </div>
    </details>
    <details>
      <summary>Advanced</summary>
      <label>Extra h3 flags</label>
      <input type="text" name="extra_args" placeholder="--core-reuse 4 …">
    </details>

    <button id="go">Generate</button>
    <div class="note" id="submit-note"></div>
  </form>

  <section>
    <div class="card" id="activity" style="display:none">
      <h2>Now</h2>
      <div id="active"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Gallery</h2>
      <div class="gallery" id="gallery"></div>
      <div class="note" id="empty-note">Nothing yet — generate something.</div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let capsSeen = false, gallerySignature = "";

function fmtTime(s) {
  s = Math.round(s);
  return s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`;
}
function settingsLine(j) {
  const s = j.settings || {};
  const bits = [`${s.width}×${s.height}`, `${s.seconds}s`, `${s.steps} steps`,
                s.preset, `seed ${s.seed}`];
  if (j.refs && j.refs.length) bits.push("+ " + j.refs.join(", "));
  return bits.join(" · ");
}

async function refresh() {
  let data;
  try { data = await (await fetch("/api/jobs")).json(); }
  catch { return; }
  if (!capsSeen) applyCaps(data.caps);
  capsSeen = true;
  if (data.caps) applyRefCaps(data.caps);
  const active = data.jobs.filter(j => j.status === "running" || j.status === "queued");
  $("activity").style.display = active.length ? "" : "none";
  $("active").innerHTML = active.map(j => {
    const eta = j.eta ? ` · ~${fmtTime(j.eta)} left` : "";
    const step = j.steps && j.status === "running" ? ` · step ${j.step}/${j.steps}` : "";
    return `<div class="job">
      <div class="head"><div>${escapeHtml(j.prompt)}</div>
        <button class="small" onclick="cancelJob('${j.id}')">cancel</button></div>
      <div class="phase">${j.status === "queued" ? "queued" : j.phase}${step}
        · ${fmtTime(j.elapsed || 0)}${eta}</div>
      <div class="bar"><i style="width:${j.percent || 0}%"></i></div>
      <div class="meta">${settingsLine(j)}</div>
    </div>`;
  }).join("");
  const done = data.jobs.filter(j => j.status === "done" && j.file);
  const errors = data.jobs.filter(j => j.status === "error").slice(0, 1);
  if (errors.length && active.length === 0) {
    $("activity").style.display = "";
    $("active").innerHTML = `<div class="job"><div class="head"><div>
      ${escapeHtml(errors[0].prompt)}</div></div>
      <div class="error">${escapeHtml(errors[0].error || "failed")}</div></div>`;
  }
  const signature = done.map(j => j.id).join(",");
  if (signature !== gallerySignature) {
    gallerySignature = signature;
    $("empty-note").style.display = done.length ? "none" : "";
    $("gallery").innerHTML = done.map(j => `<div class="clip">
      <video controls preload="metadata" src="/media/${j.file}"></video>
      <div class="prompt">${escapeHtml(j.prompt)}</div>
      <div class="meta">${settingsLine(j)} · ${fmtTime(j.elapsed || 0)}
        · <a href="/media/${j.file}" download>download</a>
        · <button class="del" onclick="deleteJob('${j.id}')">delete</button></div>
    </div>`).join("");
  }
}

function applyCaps(caps) {
  const preset = $("preset");
  preset.innerHTML = Object.entries(caps.presets)
    .map(([k, v]) => `<option value="${k}" ${k === "fast" ? "selected" : ""}>${v}</option>`) .join("");
  if (!caps.engine)
    $("submit-note").innerHTML = '<span class="warn">h3 binary not found — check H3_DIR on the server.</span>';
}
function applyRefCaps(caps) {
  const enabled = caps.ref2va;
  for (const id of ["ref_images", "ref_video", "ref_audio"])
    $(id).disabled = !enabled;
  $("ref-tag").textContent = enabled ? "" : "(Ref2VA still downloading)";
  $("ref-note").textContent = enabled
    ? "Ordered references: images become <Picture 1>…, videos/audio extend the scene."
    : "Reference inputs need the Ref2VA checkpoint; first/last frame conditioning works now.";
}
function escapeHtml(t) {
  return (t || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function cancelJob(id) { await fetch(`/api/jobs/${id}/cancel`, {method: "POST"}); }

async function deleteJob(id) {
  if (!confirm("Delete this video and its files? This cannot be undone.")) return;
  const reply = await fetch(`/api/jobs/${id}/delete`, {method: "POST"});
  if (!reply.ok) {
    const body = await reply.json().catch(() => ({}));
    alert(body.error || "delete failed");
  }
  gallerySignature = "";
  refresh();
}

$("seconds").addEventListener("change", () => {
  const total = parseInt($("seconds").value, 10);
  const note = $("chain-note");
  if (total > 15) {
    const n = Math.ceil(total / 15);
    note.style.display = "";
    note.textContent = `Rendered as ${n} chained segments — each continues from the previous clip's last frame — and stitched into one video. Roughly ${n}× a single clip's time; the soundtrack changes character at each seam.`;
  } else note.style.display = "none";
});

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  const form = new FormData($("form"));
  const [w, h] = $("size").value.split("x");
  form.set("width", w); form.set("height", h);
  $("go").disabled = true;
  $("submit-note").textContent = "";
  try {
    const reply = await fetch("/api/generate", {method: "POST", body: form});
    const body = await reply.json();
    if (!reply.ok) $("submit-note").innerHTML = `<span class="warn">${escapeHtml(body.error)}</span>`;
    else { $("submit-note").textContent = "Queued."; refresh(); }
  } catch (error) {
    $("submit-note").innerHTML = `<span class="warn">${escapeHtml(String(error))}</span>`;
  }
  $("go").disabled = false;
});
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
